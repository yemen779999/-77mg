name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "::error::Active Java version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Java version verification passed ($JAVA_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files in app/build/outputs/apk:"
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::$EXPECTED_APK does not have .apk extension." ; exit 1 ;;
          esac

          echo "APK successfully verified at: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_DIR"

          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | sed 's/[^a-zA-Z0-9._-]//-/g')
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is missing or empty."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          GitHub Actions Run Number: ${{ github.run_number }}
          GitHub Actions Run Attempt: ${{ github.run_attempt }}
          Source Commit SHA: ${{ github.sha }}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$NOTES"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=================================================="
            echo "GitHub Release published successfully!"
            gh release view "$TAG_NAME"
            
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            echo "=================================================="

            cat <<EOF >> $GITHUB_STEP_SUMMARY
            ### 🚀 Debug APK Build & Release Succeeded!

            - **Release Page**: [$RELEASE_URL]($RELEASE_URL)
            - **APK Asset Name**: \`$ASSET_NAME\`

            > 📱 **How to download on your phone**: Visit the release link above and download \`$ASSET_NAME\` directly under the **Assets** section.
            > 📦 **Backup**: The artifact \`app-debug-apk\` is also available in the GitHub Actions run summary.
            EOF
          else
            echo "=================================================="
            echo "WARNING: GitHub Release creation failed or was skipped."
            echo "The APK build succeeded and artifact 'app-debug-apk' was uploaded."
            echo "=================================================="

            cat <<EOF >> $GITHUB_STEP_SUMMARY
            ### ⚠️ Debug APK Built Successfully (Release Upload Failed)

            - **APK Build Outcome**: Succeeded
            - **Actions Artifact Name**: \`app-debug-apk\`

            > 📦 **How to download**: You can download the debug APK (\`app-debug-apk\`) from the **Artifacts** section at the bottom of this workflow run page.
            EOF
          fi
